<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈晓丹 · 游戏经历档案</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f4f6fa;
            color: #1e293b;
            padding: 40px 24px;
            line-height: 1.6;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 40px 44px 48px;
            transition: all 0.2s;
        }

        /* 头部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 24px;
            margin-bottom: 32px;
        }

        .header-left h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-left .sub {
            font-size: 15px;
            color: #64748b;
            margin-top: 4px;
            font-weight: 400;
            -webkit-text-fill-color: #64748b;
        }

        .header-right {
            text-align: right;
            font-size: 14px;
            color: #475569;
            background: #f8fafc;
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid #e2e8f0;
        }

        .header-right strong {
            color: #0f172a;
        }

        /* 统计卡片 */
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 40px;
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px 28px;
            margin-bottom: 32px;
            border: 1px solid #eef2f6;
        }

        .stats span {
            font-size: 14px;
            color: #475569;
        }

        .stats strong {
            color: #0f172a;
            font-size: 18px;
            margin: 0 4px;
        }

        .stats .tag {
            background: #e0e7ff;
            color: #4338ca;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
        }

        /* 筛选器 */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 12px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eef2f6;
        }

        .filter-btn {
            background: #f1f4f9;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .filter-btn:hover {
            background: #e2e8f0;
        }

        .filter-btn.active {
            background: #6366f1;
            color: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 4px 8px rgba(99, 102, 241, 0.25);
        }

        .filter-btn.reset {
            background: transparent;
            color: #94a3b8;
            border: 1px dashed #cbd5e1;
        }

        .filter-btn.reset:hover {
            background: #f1f5f9;
            color: #475569;
        }

        /* 表格 */
        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #eef2f6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 520px;
        }

        thead {
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
        }

        th {
            text-align: left;
            padding: 14px 18px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            position: sticky;
            top: 0;
            background: #f8fafc;
            z-index: 2;
        }

        th:hover {
            color: #6366f1;
        }

        th .arrow {
            font-size: 11px;
            margin-left: 6px;
            color: #94a3b8;
        }

        td {
            padding: 12px 18px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }

        tbody tr {
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .col-name {
            font-weight: 500;
            color: #0f172a;
        }

        .col-genre {
            color: #475569;
        }

        /* 时长条 */
        .bar-container {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 120px;
        }

        .bar-track {
            flex: 1;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            min-width: 60px;
        }

        .bar-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #818cf8, #8b5cf6);
            transition: width 0.4s ease;
            width: 0%;
        }

        .bar-label {
            font-feature-settings: "tnum";
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
            min-width: 48px;
            text-align: right;
        }

        .no-result {
            padding: 40px 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 15px;
        }

        /* footer */
        .footer {
            margin-top: 28px;
            font-size: 13px;
            color: #94a3b8;
            text-align: right;
            border-top: 1px solid #eef2f6;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .footer .badge {
            background: #f1f5f9;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #475569;
        }

        /* 移动端 */
        @media (max-width: 640px) {
            .container {
                padding: 20px 16px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .header-right {
                text-align: left;
                width: 100%;
            }
            .stats {
                flex-direction: column;
                gap: 6px;
            }
            th,
            td {
                padding: 10px 12px;
                font-size: 13px;
            }
            .bar-container {
                min-width: 80px;
            }
        }

        /* 打印优化 */
        @media print {
            .filter-btn {
                display: none;
            }
            .filters {
                border-bottom: 1px solid #ccc;
            }
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 20px;
            }
            .bar-fill {
                background: #888 !important;
            }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- 头部 -->
    <div class="header">
        <div class="header-left">
            <h1>🎮 游戏经历档案</h1>
            <div class="sub">陈晓丹 · 本地化 / 运营 / 项目助理 方向</div>
        </div>
        <div class="header-right">
            📁 离线档案 · 面试专用 &nbsp;|&nbsp; 共 <strong id="totalCount">0</strong> 款
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats" id="statsBar">
        <span>🕹️ 总游戏数：<strong id="statCount">0</strong> 款</span>
        <span>⏱️ 估算总时长：<strong id="statHours">0</strong> h+</span>
        <span>📂 类型覆盖：<strong id="statGenres">0</strong> 种</span>
        <span class="tag">🏆 最深浸入：<span id="statTop">—</span></span>
    </div>

    <!-- 筛选器 -->
    <div class="filters" id="filterContainer">
        <button class="filter-btn active" data-genre="全部">✨ 全部</button>
        <!-- JS 动态生成 -->
        <button class="filter-btn reset" data-genre="reset">↺ 重置</button>
    </div>

    <!-- 表格 -->
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th data-sort="name" style="min-width:140px;">游戏名称 <span class="arrow">⇅</span></th>
                <th data-sort="genre" style="min-width:100px;">类型 <span class="arrow">⇅</span></th>
                <th data-sort="hours" style="min-width:180px;">游玩时长 <span class="arrow">⇅</span></th>
            </tr>
            </thead>
            <tbody id="tableBody">
            <!-- JS 渲染 -->
            </tbody>
        </table>
    </div>

    <div class="footer">
        <span class="badge">📌 点击表头排序 · 点击类型筛选</span>
        <span>更新于 2026.06 · 作品集：<a href="#" style="color:#6366f1;text-decoration:none;" onclick="alert('Notion 作品集链接：https://app.notion.com/p/_-_Notion-38ab091efade8058bebff6df134c71ba\nGitHub：https://github.com/DreamingKnife/chenxiaodan-portfolio');return false;">📎 查看作品集</a></span>
    </div>
</div>

<script>
    (function() {
        // ---------- 数据（完全来自你提供的 Excel） ----------
        const rawGames = [
            { name: "《明日方舟》", genre: "塔防/RPG", hours: 965 },
            { name: "《原神》", genre: "开放世界RPG", hours: 500 },

            { name: "《塞尔达传说：旷野之息》", genre: "动作冒险", hours: 210 },
            { name: "《剑侠情缘网络版叁》", genre: "MMORPG", hours: 200 },
            { name: "《Fate/Grand Order》", genre: "卡牌RPG", hours: 200 },
            { name: "《异度神剑3》", genre: "JRPG", hours: 170 },

            { name: "《女神异闻录4 黄金版》", genre: "JRPG", hours: 135 },
            { name: "《脑叶公司》", genre: "模拟经营/恐怖", hours: 120 },
            { name: "《死亡搁浅》", genre: "社交模拟/动作", hours: 110 },
            { name: "《边狱巴士》", genre: "回合制RPG", hours: 100 },
            { name: "《女神异闻录3 Reload》", genre: "JRPG", hours: 100 },
            { name: "《苏丹的游戏》", genre: "解谜/策略", hours: 100 },
            { name: "《黎明杀机》", genre: "非对称竞技", hours: 100 },
            { name: "《最终幻想VII：重制版》", genre: "ARPG", hours: 85 },
            { name: "《崩坏：星穹铁道》", genre: "回合制RPG", hours: 75 },
            { name: "《逆转裁判123：成步堂精选集》", genre: "法庭辩论AVG", hours: 60 },
            { name: "《轩辕剑参外传：天之痕》", genre: "国产RPG", hours: 60 },
            { name: "《喵斯快跑》", genre: "音游", hours: 50 },
            { name: "《王国之心2》", genre: "ARPG", hours: 50 },
            { name: "《未定事件簿》", genre: "乙女向推理", hours: 50 },
            { name: "《赛博朋克2077》", genre: "开放世界RPG", hours: 45 },
            { name: "《古剑奇谭2：永夜初晗凝碧天》", genre: "国产RPG", hours: 45 },
            { name: "《古剑奇谭1：琴心剑魄今何在》", genre: "国产RPG", hours: 45 },
            { name: "《王国之心1》", genre: "ARPG", hours: 40 },
            { name: "《塞尔达传说：黄昏公主》", genre: "动作冒险", hours: 40 },
            { name: "《塞尔达传说：御天之剑》", genre: "动作冒险", hours: 40 },
            { name: "《匹诺曹的谎言》", genre: "动作RPG", hours: 40 },
            { name: "《人狼村之谜》", genre: "悬疑/文字冒险", hours: 40 },
            { name: "《恶灵附身》", genre: "生存恐怖", hours: 40 },
            { name: "《塞尔达传说：时之笛》", genre: "动作冒险", hours: 35 },
            { name: "《王国之心3》", genre: "ARPG", hours: 35 },
            { name: "《极乐迪斯科》", genre: "开放世界RPG", hours: 35 },
            { name: "《百日战记 -最终防卫学园-》", genre: "冒险/策略", hours: 35 },
            { name: "《Sally Face》", genre: "恐怖/解谜", hours: 35 },
            { name: "《VA-11 HALL-A》", genre: "赛博朋克/文字冒险", hours: 35 },
            { name: "《黑神话：悟空》", genre: "动作RPG", hours: 35 },
            { name: "《塞尔达传说：梅祖拉的假面》", genre: "动作冒险", hours: 30 },
            { name: "《真三国无双：起源》", genre: "动作割草", hours: 30 },
            { name: "《戏剧性谋杀》", genre: "BL/文字冒险", hours: 30 },
            { name: "《Undertale》", genre: "meta-RPG", hours: 20 },
            { name: "《生化危机4：重制版》", genre: "生存恐怖", hours: 20 },
            { name: "《节奏天国》", genre: "音游", hours: 20 },
            { name: "《Deltarune》", genre: "meta-RPG", hours: 15 },
            { name: "《黑暗世界：因与果》", genre: "心理恐怖", hours: 15 },
            { name: "《原子之心》", genre: "FPS/RPG", hours: 10 },
            { name: "《鬼泣5》", genre: "动作", hours: 10 },
            { name: "《Rusty Lake: Seasons》", genre: "解谜", hours: 8 },
            { name: "《頭七》", genre: "中式恐怖解谜", hours: 8 },
            { name: "《说谎公主与盲眼王子》", genre: "解谜/童话风", hours: 5 },
            { name: "《沙耶之歌》", genre: "视觉小说", hours: 5 },
            { name: "《Helltaker》", genre: "AVG", hours: 5 },
            { name: "《烟火》", genre: "中式恐怖/叙事", hours: 5 },
            { name: "《The Past Within》", genre: "双人合作解谜", hours: 5 },
            { name: "《三伏》", genre: "悬疑叙事", hours: 5 },
            { name: "《动物井》", genre: "类银河城", hours: 5 },
            { name: "《勇敢的心：世界大战》", genre: "叙事解谜", hours: 5 },
            { name: "《Reanimal》Demo", genre: "恐怖解谜", hours: 1 },
            { name: "《13F》", genre: "恐怖解谜", hours: 0.5 }
        ];

        // 补充“死亡搁浅1”重名处理（数据已有死亡搁浅，不加重复）
        // 确认所有数据完整

        // ---------- 全局状态 ----------
        let currentGenre = "全部";
        let currentSort = { key: "hours", asc: false }; // 默认时长降序
        let filteredData = [];

        // 提取所有类型（去重）
        const allGenres = new Set();
        rawGames.forEach(g => {
            // 处理混合类型（如"塔防/RPG"拆开）
            const parts = g.genre.split(/[\/,、]/).map(s => s.trim());
            parts.forEach(p => allGenres.add(p));
        });
        // 加入"全部"
        const genreList = ["全部", ...Array.from(allGenres).sort()];

        // DOM 引用
        const tbody = document.getElementById('tableBody');
        const filterContainer = document.getElementById('filterContainer');
        const statCount = document.getElementById('statCount');
        const statHours = document.getElementById('statHours');
        const statGenres = document.getElementById('statGenres');
        const statTop = document.getElementById('statTop');
        const totalCount = document.getElementById('totalCount');

        // ---------- 辅助函数 ----------
        function getHoursNum(h) { return h; } // 已经数字

        function getMaxHours() {
            let max = 0;
            rawGames.forEach(g => { if (g.hours > max) max = g.hours; });
            return max;
        }
        const MAX_HOURS = getMaxHours();

        // 渲染表格
        function render() {
            // 1. 筛选
            let data = rawGames;
            if (currentGenre !== "全部") {
                data = rawGames.filter(g => g.genre.includes(currentGenre));
            }

            // 2. 排序
            const sorted = [...data];
            const key = currentSort.key;
            const asc = currentSort.asc;
            sorted.sort((a, b) => {
                let va = a[key];
                let vb = b[key];
                if (typeof va === 'string') va = va.toLowerCase();
                if (typeof vb === 'string') vb = vb.toLowerCase();
                if (va < vb) return asc ? -1 : 1;
                if (va > vb) return asc ? 1 : -1;
                return 0;
            });

            filteredData = sorted;

            // 3. 更新统计
            const total = rawGames.length;
            const totalH = rawGames.reduce((sum, g) => sum + g.hours, 0);
            const uniqueGenres = new Set();
            rawGames.forEach(g => {
                const parts = g.genre.split(/[\/,、]/).map(s => s.trim());
                parts.forEach(p => uniqueGenres.add(p));
            });
            statCount.textContent = total;
            statHours.textContent = totalH;
            statGenres.textContent = uniqueGenres.size;

            // 最长游戏
            let topGame = rawGames.reduce((a, b) => a.hours > b.hours ? a : b);
            statTop.textContent = topGame.name + ' (' + topGame.hours + 'h+)';
            totalCount.textContent = filteredData.length;

            // 4. 渲染行
            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="no-result">😕 没有找到该类型的游戏，试试其他筛选吧</td></tr>`;
                return;
            }

            let html = '';
            filteredData.forEach(g => {
                const pct = Math.min((g.hours / MAX_HOURS) * 100, 100);
                html += `<tr>
                    <td class="col-name">${g.name}</td>
                    <td class="col-genre">${g.genre}</td>
                    <td>
                        <div class="bar-container">
                            <div class="bar-track">
                                <div class="bar-fill" style="width:${pct}%;"></div>
                            </div>
                            <span class="bar-label">${g.hours}h+</span>
                        </div>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        // 生成筛选按钮
        function buildFilters() {
            const html = genreList.map(genre => {
                const active = genre === currentGenre ? 'active' : '';
                const isReset = genre === '全部' ? '' : '';
                return `<button class="filter-btn ${active}" data-genre="${genre}">${genre}</button>`;
            }).join('');
            // 插入到“全部”后面，保留重置按钮逻辑（重置即切换到“全部”）
            filterContainer.innerHTML = html + `<button class="filter-btn reset" data-genre="reset">↺ 重置</button>`;
        }

        // 事件绑定（委托）
        function initEvents() {
            filterContainer.addEventListener('click', function(e) {
                const btn = e.target.closest('.filter-btn');
                if (!btn) return;
                const genre = btn.dataset.genre;
                if (genre === 'reset') {
                    currentGenre = '全部';
                } else {
                    currentGenre = genre;
                }
                // 更新激活状态
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                if (genre !== 'reset') {
                    btn.classList.add('active');
                } else {
                    document.querySelector('.filter-btn[data-genre="全部"]')?.classList.add('active');
                }
                render();
            });

            // 表头排序
            document.querySelectorAll('th[data-sort]').forEach(th => {
                th.addEventListener('click', function() {
                    const key = this.dataset.sort;
                    if (currentSort.key === key) {
                        currentSort.asc = !currentSort.asc;
                    } else {
                        currentSort.key = key;
                        currentSort.asc = (key === 'hours') ? false : true; // 时长默认降序，其他默认升序
                    }
                    render();
                    // 更新箭头（简易视觉）
                    document.querySelectorAll('th .arrow').forEach(el => el.textContent = '⇅');
                    const arrow = this.querySelector('.arrow');
                    if (arrow) arrow.textContent = currentSort.asc ? '↑' : '↓';
                });
            });
        }

        // ---------- 初始化 ----------
        function init() {
            buildFilters();
            // 默认激活“全部”
            document.querySelector('.filter-btn[data-genre="全部"]')?.classList.add('active');
            // 默认排序：时长降序
            currentSort = { key: "hours", asc: false };
            render();
            // 设置表头箭头
            const th = document.querySelector('th[data-sort="hours"]');
            if (th) th.querySelector('.arrow').textContent = '↓';
            initEvents();
        }

        init();
    })();
</script>
</body>
</html>
