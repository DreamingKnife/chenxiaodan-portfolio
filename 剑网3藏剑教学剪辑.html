<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>剑网3藏剑教学剪辑 · 舟行</title>
<meta name="description" content="剑网3 主题视频剪辑 —— 游戏理解、节奏把控与视觉叙事能力">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg-deep:#060a14; --bg:#0a0e1a; --bg-elevated:#0f1524;
  --text:#e8ecf4; --text-bright:#f4f6fc; --muted:#8b9bb8;
  --accent:#a5b4fc; --accent-glow:rgba(165,180,252,.35);
  --accent-soft:rgba(165,180,252,.12); --accent-line:rgba(165,180,252,.18);
  --line:rgba(255,255,255,.08); --card-bg:rgba(15,21,36,.65);
  --card-border:rgba(165,180,252,.14);
  --font-heading:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --space-sm:16px; --space-md:24px; --space-lg:32px; --space-xl:48px;
  --radius-md:16px; --radius-lg:22px;
  --shadow-card:0 4px 24px rgba(0,0,0,.3),0 0 0 1px var(--card-border);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{background:var(--bg-deep);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;}
#starfield-canvas{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.7;}
.wrap{max-width:760px;margin:0 auto;padding:0 var(--space-sm);position:relative;z-index:1;}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);background:rgba(6,10,20,.7);border-bottom:1px solid var(--line);}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;}
.brand{font-family:var(--font-heading);font-weight:700;font-size:17px;letter-spacing:.03em;color:var(--text-bright);text-decoration:none;}
.back-btn{font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--accent);text-decoration:none;padding:6px 14px;border-radius:99px;border:1px solid var(--accent-line);background:var(--accent-soft);transition:background .2s ease,border-color .2s ease,transform .2s ease;display:inline-flex;align-items:center;gap:6px;}
.back-btn:hover{background:rgba(165,180,252,.18);border-color:rgba(165,180,252,.35);transform:translateY(-1px);}
.video-section{padding:40px 0 24px;}
.video-kicker{font-family:var(--font-heading);font-size:13px;font-weight:500;letter-spacing:.38em;color:var(--accent);margin-bottom:14px;text-transform:uppercase;display:block;}
.video-player-wrap{border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--card-border);box-shadow:0 8px 40px rgba(0,0,0,.4),0 0 60px rgba(165,180,252,.06);background:#000;}
.video-player-wrap video{width:100%;display:block;aspect-ratio:16/9;}
.video-info{padding:28px 0 16px;}
.video-tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:99px;margin-bottom:12px;font-weight:600;}
.video-title{font-family:var(--font-heading);font-size:clamp(22px,4vw,28px);font-weight:700;color:var(--text-bright);line-height:1.3;margin-bottom:12px;}
.video-desc{font-size:15px;color:var(--text);line-height:1.85;margin-bottom:20px;}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
.meta-item{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-md);padding:14px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.meta-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-family:var(--font-heading);}
.meta-value{font-size:14px;color:var(--text-bright);font-weight:500;}
.skills-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;}
.skill-badge{font-size:13px;color:var(--accent);border:1px solid var(--accent-line);background:var(--accent-soft);padding:5px 12px;border-radius:99px;font-weight:500;}
footer{text-align:center;padding:48px 0 40px;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--accent);text-decoration:none;font-size:14px;transition:color .2s ease;}
footer a:hover{color:var(--text-bright);}
@media(max-width:480px){.meta-grid{grid-template-columns:1fr;}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}#starfield-canvas{display:none;}}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;}
</style>
</head>
<body>

<canvas id="starfield-canvas" aria-hidden="true"></canvas>

<header>
  <div class="wrap">
    <a class="brand" href="../../index.html">舟行</a>
    <a class="back-btn" href="../../index.html#works">&larr; 回到主站</a>
  </div>
</header>

<div class="wrap">

  <section class="video-section">
    <span class="video-kicker">视频作品</span>
    <div class="video-player-wrap">
      <video controls preload="metadata" playsinline>
        <source src="videos/v3_jianwang3.mp4" type="video/mp4">
        您的浏览器不支持视频播放。
      </video>
    </div>
  </section>

  <section class="video-info">
    <span class="video-tag">游戏内容 · 二次创作</span>
    <h1 class="video-title">剑网3 视频剪辑</h1>
    <p class="video-desc">
      剑网3 主题视频剪辑作品。200h+ 的游戏经历是底层操作系统——不是泛泛地「喜欢游戏」，而是真的理解技能机制、职业生态和玩家情绪，剪出来的东西才知道在哪里卡点、在哪里留白。
      <br><br>
      这个作品体现的是「玩家视角」的内容转化能力：把对游戏系统的深度理解，转译成让其他玩家「看了会共鸣」的视觉叙事。这也是我做游戏内容运营 / 本地化的底层资本。
    </p>

    <div class="meta-grid">
      <div class="meta-item"><div class="meta-label">类型</div><div class="meta-value">游戏 · 二创视频</div></div>
      <div class="meta-item"><div class="meta-label">游戏</div><div class="meta-value">剑网3（200h+）</div></div>
      <div class="meta-item"><div class="meta-label">角色</div><div class="meta-value">剪辑 · 节奏设计</div></div>
      <div class="meta-item"><div class="meta-label">工具</div><div class="meta-value">CapCut（剪映）</div></div>
    </div>

    <div class="skills-row">
      <span class="skill-badge">游戏理解</span>
      <span class="skill-badge">节奏把控</span>
      <span class="skill-badge">视觉叙事</span>
      <span class="skill-badge">玩家视角</span>
      <span class="skill-badge">情绪卡点</span>
    </div>
  </section>

  <footer>
    <a href="../../index.html#works">&larr; 回到「舟行」主站</a>
  </footer>

</div>

<script>
(function(){
  const c=document.getElementById('starfield-canvas');
  if(!c)return;
  const ctx=c.getContext('2d');
  let W,H;
  const stars=[];
  const N=150;
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  resize();
  window.addEventListener('resize',resize);
  for(let i=0;i<N;i++){stars.push({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()});}
  function draw(){
    ctx.fillStyle='rgba(6,10,20,.2)';ctx.fillRect(0,0,W,H);
    const cx=W/2,cy=H/2;
    for(const s of stars){
      s.z-=0.004;
      if(s.z<=0.02){s.x=Math.random()*2-1;s.y=Math.random()*2-1;s.z=1;}
      const px=cx+(s.x/s.z)*cx;const py=cy+(s.y/s.z)*cy;
      if(px<0||py<0||px>W||py>H)continue;
      const r=Math.max(.5,(1-s.z)*2.2);
      ctx.globalAlpha=Math.min(1,(1-s.z)*1.2);
      ctx.fillStyle='#a5b4fc';ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;requestAnimationFrame(draw);
  }
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){draw();}
  else{ctx.fillStyle='rgba(6,10,20,1)';ctx.fillRect(0,0,W,H);const cx=W/2,cy=H/2;for(const s of stars){const px=cx+(s.x/s.z)*cx;const py=cy+(s.y/s.z)*cy;if(px<0||py<0||px>W||py>H)continue;ctx.globalAlpha=.6;ctx.fillStyle='#a5b4fc';ctx.beginPath();ctx.arc(px,py,1,0,Math.PI*2);ctx.fill();}}
})();
</script>
</body>
</html>
